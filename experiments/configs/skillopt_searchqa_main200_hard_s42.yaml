_base_: ../../external/SkillOpt/configs/searchqa/default.yaml

model:
  backend: openai_compatible
  optimizer_backend: openai_compatible
  target_backend: openai_compatible
  optimizer: gpt-5.4
  target: gpt-5.4
  reasoning_effort: low
  rewrite_max_completion_tokens: 4096

train:
  num_epochs: 1
  train_size: 200
  batch_size: 40
  accumulation: 1
  seed: 42

gradient:
  minibatch_size: 5
  merge_batch_size: 4
  analyst_workers: 2
  max_analyst_rounds: 1

optimizer:
  learning_rate: 2
  min_learning_rate: 2
  lr_scheduler: constant
  skill_update_mode: patch
  use_slow_update: false
  use_meta_skill: false

evaluation:
  use_gate: true
  gate_metric: hard
  sel_env_num: 100
  test_env_num: 100
  eval_test: true

env:
  workers: 4
  max_completion_tokens: 2048
  limit: 200