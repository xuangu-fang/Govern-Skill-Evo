_base_: ../../external/SkillOpt/configs/livemathematicianbench/default.yaml

model:
  backend: openai_compatible
  target_backend: openai_compatible
  optimizer_backend: openai_compatible
  target: deepseek-flash
  optimizer: deepseek-flash
  reasoning_effort: medium

env:
  # Source records; the local LMB adapter groups them by v27's frozen train/val/test IDs.
  split_dir: data/livemathematicianbench/prepared_v1
  # Training rollouts inherit workers=64 from the upstream LMB config.
  max_completion_tokens: 65536

optimizer:
  slow_update_gate_with_selection: true

evaluation:
  gate_metric: hard
  sel_env_num: 18
  test_env_num: 124
  # Final Selection is completed by the launcher before the independent Best Test.
  eval_test: false
