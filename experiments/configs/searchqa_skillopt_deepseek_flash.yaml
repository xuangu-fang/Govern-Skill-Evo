_base_: ../../external/SkillOpt/configs/searchqa/default.yaml

model:
  backend: openai_compatible
  target_backend: openai_compatible
  optimizer_backend: openai_compatible
  target: deepseek-flash
  optimizer: deepseek-flash
  reasoning_effort: medium

env:
  split_dir: data/searchqa/prepared_v1
  workers: 60
  exec_timeout: 300
  max_completion_tokens: 32768

optimizer:
  slow_update_gate_with_selection: true

evaluation:
  gate_metric: hard
  sel_env_num: 200
  test_env_num: 1400
  # Test uses the shared SearchQA evaluator after selection is frozen.
  eval_test: false
