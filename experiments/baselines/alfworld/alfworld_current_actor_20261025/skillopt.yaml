# Standalone recipe: do not inherit mutable upstream defaults.
# Paths are relative to Govern-Skill-Evo, resolved by the prepared launcher.
model:
  backend: openai_compatible
  optimizer_backend: openai_compatible
  target_backend: openai_compatible
  optimizer: deepseek-v4.1-flash
  target: deepseek-v4.1-flash
  reasoning_effort: medium
  rewrite_reasoning_effort: ""
  rewrite_max_completion_tokens: 16384
train:
  num_epochs: 4
  train_size: 39
  batch_size: 40
  accumulation: 1
  seed: 42
gradient:
  minibatch_size: 8
  merge_batch_size: 8
  analyst_workers: 16
  max_analyst_rounds: 3
  failure_only: false
optimizer:
  learning_rate: 4
  min_learning_rate: 2
  lr_scheduler: cosine
  lr_control_mode: fixed
  skill_update_mode: patch
  use_slow_update: true
  slow_update_samples: 20
  slow_update_gate_with_selection: true
  longitudinal_pair_policy: mixed
  use_meta_skill: true
  use_skill_aware_reflection: false
  skill_aware_appendix_source: both
  skill_aware_consolidate_threshold: 0
evaluation:
  use_gate: true
  gate_metric: hard
  use_semantic_density: false
  sel_env_num: 0  # all 18 items in the frozen selection manifest
  test_env_num: 0 # all 134 items in the frozen test manifest
  eval_test: true # Initial and validation-selected Best
  eval_final_skill: false # preserve final artifact/selection; skip extra Final Test
env:
  name: alfworld
  skill_init: experiments/baselines/alfworld/alfworld_current_actor_20261025/initial_skill.md
  split_mode: split_dir
  split_seed: 42
  split_dir: experiments/baselines/alfworld/alfworld_current_actor_20261025/splits
  data_path: ""
  split_output_dir: ""
  max_steps: 50
  max_completion_tokens: 16384
  workers: 8
  max_api_workers: 8
  limit: 0
  out_root: artifacts/baselines/skillopt/alfworld_current_actor_20261025
