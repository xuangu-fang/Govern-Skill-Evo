prompt = "在本对话中执行已获用户授权的 ALFWorld 定时训练、有限恢复与最终测试。工作区 /Users/didi/Desktop/Govern-Skill-Evo。先读取 experiments/automations/alfworld_v24_1_skilladam_20261030_001/plan.json 和 recovery_ledger.json；计划中的完整命令、路径、配置哈希与授权边界为准。首次启动不得早于 2026-10-29T20:44:03Z（北京时间 2026-10-30 04:44:03）。每次唤醒先核对时间、持久状态、PID及实际命令行、子 Actor 和最近阶段产物，防止重复启动。\n\n到期后只启动两项：v24.1 的 alfworld_reviewed_no_review_workers10_20261030_001，以及 SkillAdam 的 skilladam_alfworld_native_retry_20261029_001。启动前只读核对冻结源码、配置、数据与运行环境；现有离线预检命令可复用。用 plan.json 中的 train_command 启动长驻后台进程，每组保留独立日志、PID、命令和退出状态，必要时使用随进程结束的 caffeinate 保持机器唤醒。将调度状态保存在本计划目录。密钥仅由已有 .env/环境安全加载，不能打印或另存。不要调用旧 v24 或旧 SkillAdam 实验，不继承旧 Skill/Memory/Momentum/检查点；两组都从批准的初始 Skill 开始，训练并发各为10，v24.1 关闭 Verifier/Repair。模型、提示词、数据顺序、预算、Gate和其他算法条件保持冻结配置。\n\n随后每30分钟检查。进程仍正常运行时不重启、不并发接管同一调用。仅在程序已停止且失败明确属于以下三类时，用户预先授权为该失败逻辑调用补一次额度，最多追加3次实际模型HTTP请求：\n1. SkillAdam 的 momentum_update 阶段失败；\n2. v24.1 自进化模块已耗尽原6次请求而停止；\n3. 任一方法 Actor 的当前动作请求已耗尽原6次请求而停止。\n额度按方法、训练或测试阶段、轮次、任务、动作/逻辑请求身份持久记账，不能按监测次数重新授予。新增请求发出前即记录消耗；SDK内部重试也计入这3次，不得变成3轮SDK调用再各自重试。成功即停止补额并继续原程序；追加3次仍失败，停止该任务的自动恢复并报告，不再补额、不重新跑任务或重置计数。未启动的未来调用仍使用原配置额度。其他错误（例如配置/源码漂移、磁盘/程序故障、鉴权问题）不通过补额绕过。\n\n原入口不一定具备上述通用恢复能力。出现符合条件的失败时，先确认保存响应是否已经成功且可由原校验器恢复；若需要新请求，可以在本计划目录创建仅作用于该失败调用的恢复包装、独立授权记录和离线测试，这是本次补额授权的实施范围。完整保留原请求、响应、临时格式反馈、错误、轨迹、检查点及费用；不能手工修改模型输出，不能伪造成功或静默改写原冻结契约。技术错误保持同一请求内容，格式错误沿用原反馈协议。只续接未完成的步骤；Actor 若需重建环境，应只确定性重放已经执行的动作、核对观察及状态，不重新采样已完成动作、不给整条episode重新6次机会。不具备安全续接条件则停止并报告。不得将所有 max_attempts 全局改为9。新增恢复代码先完成针对性的离线检查，再调用真实模型。未完成Momentum不能记作训练完成。\n\n只有两组训练全部完成才启动最终Test，不能一组完成就先测。v24.1需 next_round=7、六轮正式发布且 final_parent校验通过；SkillAdam需completion.json完整六轮、checkpoint next_iteration=6、pending_post_decision=null，final_skill与current_skill相同。使用同一已冻结134题Test与各自最终正式Skill，执行plan.json中test_command；SkillAdam已准备专门的evaluate_skilladam.py，默认只验证、显式--start才执行。测试独立输出、只执行一次，完成任务不重复；不更新训练Skill、Memory、Momentum或将测试反馈送回优化器。Actor重试耗尽依照上面的同一有限补额边界处理，不追加其他恢复类型。两项Test完成后汇总各自成功数/134、成功率、耗时、已知费用和补额记录，并停止本自动化。若补额后终止使两组无法均完成，禁止启动Test，允许另一项已运行训练结束；无可继续工作时停止自动化并报告。\n\n状态未变化或没有可行动事件时保持安静。只在启动、符合条件的中断及恢复、追加额度耗尽、需要用户处理、训练全部完成开始Test、或最终结果时通知。\n调度切换：本自动化首次唤醒安排在北京时间2026-10-30 04:44。首次到期唤醒时，先通过automation_update将本自动化更新为ACTIVE的每30分钟heartbeat，并保留本提示、名称和当前对话目标；不另建重复自动化。可从本计划目录automation.json或本地automation.toml取得ID。若唤醒时比not_before早几秒，只等待到该时间；不要提前训练。后续每次唤醒继续同一持久状态。"
