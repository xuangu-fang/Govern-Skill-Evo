        interaction.
    user_scenario:
      persona: The user communicates briefly and directly.
      instructions:
        domain: airline
        reason_for_call: The user wants to cancel the reservation and receive delayed-flight compensation for the
          affected passengers.
        known_info: 'The user is Isabella Lopez with user id isabella_lopez_2185.


          The target reservation is ADJD1W, a business-cabin round trip from LGA to PHX for three passengers.


          Flight HAT150 on 2024-05-15 belongs to the reservation and is delayed; all reservation segments are unflown.


          The reservation is already cancelled in the current airline record.


          The cancellation reason is a change of travel plans, and the original credit-card refund mechanism is
          available.


          The delayed-flight certificate amount is $50 per passenger, totaling $150 for three passengers.


          Handle reservation ADJD1W for user isabella_lopez_2185.


          The user complains that HAT150 on 2024-05-15 is delayed and explicitly requests both cancellation and
          compensation.


          The cancellation reason is a change of travel plans.


          The reservation has three passengers in business cabin; the delayed-flight certificate is $150 total.


          Price is not the user''s main concern.


          The user also has a preferred travel time window.


          The user has a seat preference, subject to availability.'
        task_instructions: 'Present the main goal before secondary travel constraints.


          Make the relevant account or reservation identifier available initially.


          Complain naturally about the verified delayed flight and clearly request both cancellation and compensation.


          Explicitly request the policy-appropriate certificate for all affected passengers.


          Keep the cancellation reason explicit and do not change the passenger count or requested transaction.


          Keep the cancellation reason and explicit compensation request clear when discussing the requested resolution.


          Confirm factual details through the available read-only tools as needed.'
    initial_state:
      initialization_actions:
      - env_type: assistant
        func_name: cancel_reservation
        arguments:
          reservation_id: ADJD1W
    evaluation_criteria:
      actions:
      - action_id: gse_air_f386d6ab84c7_gold_1
        requestor: assistant
        name: send_certificate
        arguments:
          user_id: isabella_lopez_2185
          amount: 150
      communicate_info: []
      reward_basis:
      - DB
  expected_governance: 'The target reservation is already cancelled, so the verified delayed-flight certificate
