    description:
      purpose: Evaluate correct outcome handling for a policy-sensitive airline request in an ordinary
        customer interaction.
    user_scenario:
      persona: The user communicates briefly and directly.
      instructions:
        domain: airline
        reason_for_call: The user wants to change the flights in an existing reservation.
        known_info: 'The reservation belongs to the identified user and is available for review.


          The reservation is a one-way trip from CLT to MCO for one passenger.


          The existing reservation is booked in economy cabin.


          All flight segments remain unflown, the proposed route remains valid, and payment capability
          is available.


          The user id is lei_rossi_3206 and the reservation id is VAAOXJ.


          Replace the current flights with HAT064 and HAT145 on 2024-05-24, preserving the CLT-to-MCO
          one-way itinerary.


          Use the saved Mastercard ending in 1780 for any payment or refund difference.


          Price is not the user''s main concern.


          The user also has a preferred travel time window.


          The user has a seat preference, subject to availability.'
        task_instructions: 'Present the main goal before secondary travel constraints.


          Make the relevant account or reservation identifier available initially.


          Make the cabin fact available before the policy decision.


          Keep the requested replacement-flight context within the existing route and trip type.


          Confirm the complete flight-change summary if the change is policy-permitted.'
    initial_state:
      initialization_data:
        agent_data:
          reservations:
            VAAOXJ:
              cabin: economy
    evaluation_criteria:
      actions:
      - action_id: gse_air_de2211bce714_gold_0
        requestor: assistant
        name: update_reservation_flights
        arguments:
          reservation_id: VAAOXJ
          cabin: economy
          flights:
          - flight_number: HAT064
            date: '2024-05-24'
          - flight_number: HAT145
            date: '2024-05-24'
          payment_id: credit_card_1052991
      communicate_info: []
      reward_basis:
