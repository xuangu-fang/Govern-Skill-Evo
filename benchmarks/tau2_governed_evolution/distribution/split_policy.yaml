schema_version: 1
assignment_policy:
  split_basis: hidden_construction_provenance
  random_task_level_split_allowed: false
  assignment_precedes_final_calibration: true
  calibration_outcome_instance_selection_allowed: false

split_exclusivity:
  exact_task_split_exclusive: true
  surface_manifestation_split_exclusive: true
  latent_world_split_exclusive: true
  latent_family_split_exclusive: true
  composition_grid_split_exclusive: true
  composition_family_split_exclusive: true
  concrete_entity_family_split_exclusive: true

cross_split_learning_units:
  policy_concept_may_cross_split: true
  boundary_template_may_cross_split: true
  rationale: Same governance mechanism is learned from seen families and evaluated on unseen families.

family_identity:
  latent_family_id:
    definition: >
      Stable identifier for one counterfactual construction family sharing a base entity family,
      state configuration, policy predicate mechanism, controlled variables, and invariants.
    contains: [latent_worlds, surface_manifestations, concrete_tasks]
    assignment_rule: exactly_one_split
  composition_family_id:
    definition: >
      Stable identifier for one composition construction family sharing its rule set, base entity
      family, factor definitions, invariants, and complete 2x2 grid.
    contains: [all_four_composition_worlds, surface_manifestations, concrete_tasks]
    assignment_rule: exactly_one_split

composition_holdout:
  train_composition_family_count: 0
  monitor_composition_family_count: 0
  test_minimum_independent_composition_families: 2
  complete_grid_must_remain_together: true
  calibrated_step14_family_allowed_in_final_splits: false

external_original_tau2_preservation:
  separate_track: true
  used_for_diagnosis: false
  used_for_editor: false
  used_as_evolution_batch: false
  gate_changes_in_step15: false
