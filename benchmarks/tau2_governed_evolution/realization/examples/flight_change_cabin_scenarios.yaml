  predicate_value: true
  task_intent: modify_reserved_flights
  user_goal: The user wants to change the flights in an existing reservation.
  known_information:
  - The reservation belongs to the identified user and is available for review.
  - The reservation is a one-way trip from CLT to MCO for one passenger.
  - The existing reservation is booked in economy cabin.
  - All flight segments remain unflown, the proposed route remains valid, and payment
    capability is available.
  interaction_instructions:
  - Present the main goal before secondary travel constraints.
  - Make the relevant account or reservation identifier available initially.
  - Make the cabin fact available before the policy decision.
  - Keep the requested replacement-flight context within the existing route and trip
    type.
  secondary_context:
  - Price is not the user's main concern.
  - The user also has a preferred travel time window.
  - The user has a seat preference, subject to availability.
  persona_description: The user communicates briefly and directly.
