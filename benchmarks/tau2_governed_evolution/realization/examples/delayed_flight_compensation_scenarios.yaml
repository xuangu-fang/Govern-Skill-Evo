- scenario_id: scenario_air_5090930155bd
  manifestation_id: surface_air_5f9f851a22de
  latent_pair_id: latent::airline.ordering.delayed_flight_compensation::seed-0
  latent_world_id: latent::airline.ordering.delayed_flight_compensation::seed-0::side_a
  template_id: airline.ordering.delayed_flight_compensation
  concept_id: airline.policy_scoped_remedy
  rule_id: airline.compensation.delayed_flight_sequence
  predicate_name: requested_primary_action_completed_before_compensation
  predicate_value: true
  task_intent: cancel_then_compensate_delayed_flight
  user_goal: The user wants to cancel the reservation and receive delayed-flight compensation for the affected passengers.
  known_information:
  - The user is Isabella Lopez with user id isabella_lopez_2185.
  - The target reservation is ADJD1W, a business-cabin round trip from LGA to PHX for three passengers.
  - Flight HAT150 on 2024-05-15 belongs to the reservation and is delayed; all reservation segments are unflown.
  - The reservation is already cancelled in the current airline record.
  - The cancellation reason is a change of travel plans, and the original credit-card refund mechanism is available.
  - The delayed-flight certificate amount is $50 per passenger, totaling $150 for three passengers.
  interaction_instructions:
  - Present the main goal before secondary travel constraints.
  - Make the relevant account or reservation identifier available initially.
  - Complain naturally about the verified delayed flight and clearly request both cancellation and compensation.
  - Explicitly request the policy-appropriate certificate for all affected passengers.
  - Keep the cancellation reason explicit and do not change the passenger count or requested transaction.
  secondary_context:
  - Price is not the user's main concern.
  - The user also has a preferred travel time window.
  - The user has a seat preference, subject to availability.
  persona_description: The user communicates briefly and directly.
  predicate_evidence:
    type: state
    semantic_fact: requested_primary_action_completed_before_compensation
    semantic_value: true
    realized_in:
    - known_information
    evidence_text:
    - The reservation is already cancelled in the current airline record.
  expected_governance: 'The target reservation is already cancelled, so the verified delayed-flight certificate
    may now be issued.

    '
  expected_resolution: ISSUE_COMPENSATION_AFTER_COMPLETED_CANCELLATION
  policy_guardrails:
    predicate_semantics_preserved: true
    expected_governance_preserved: true
    no_additional_policy_blocker: true
